# Screen states for Pokemon Champions VGC
# Source of truth for detection, reading, testing, and state machine.
#
# Every screen directory in test_images/ maps 1:1 to an entry here.
# Detectors return bool (true on registered screens, false on all others).
# Readers extract structured data; field schemas define manifest shape.

screens:

  # ── Pre-battle ──────────────────────────────────────────────

  team_select:
    description: "Registering team of 6 (selecting which mons make up Team 1, etc.)."
    transitions_to: [pre_match]
    detectors: [TeamSelectDetector]
    readers:
      TeamSelectReader:
        fields:
          species:
            type: array
            items: string
            length: 6

  searching_for_battle:
    description: "Animation/transition after pressing Begin Matchmaking."
    transitions_to: [match_intro, team_preview_selecting]
    detectors: [SearchingForBattleDetector]
    readers: {}

  match_intro:
    description: "VS-banner intro after matchmaking found a match: both players' names, ranks, format label, and character models on screen."
    transitions_to: [team_preview_selecting]
    detectors: []
    readers: {}

  team_preview_selecting:
    description: "Choosing which 4 mons to bring. Opponent team visible. No Standing By pills."
    transitions_to: [team_preview_locked_in]
    detectors: [TeamPreviewDetector]
    readers:
      TeamPreviewReader:
        fields:
          own_species:
            type: array
            items: string
            length: 6
          opponent_species:
            type: array
            items: string
            length: 6

  team_preview_locked_in:
    description: "All selections made, Standing By pills visible on both sides."
    transitions_to: [action_menu]
    # TeamPreviewDetector OCRs "Select 4 Pokemon..." which only appears on
    # the selecting variant — never fires here. PreparingForBattleDetector
    # is the correct screen classifier for locked-in.
    detectors: [PreparingForBattleDetector]
    readers:
      TeamPreviewReader:
        fields:
          own_species:
            type: array
            items: string
            length: 6
          opponent_species:
            type: array
            items: string
            length: 6

  # ── In-battle ──────────────────────────────────────────────
  # Singles and doubles share directories. Readers handle 1 or 2
  # mons on each side (doubles with 1 remaining looks like singles).

  action_menu:
    description: "FIGHT / POKEMON buttons visible. Singles or doubles."
    transitions_to: [move_select, singles_switch, doubles_switch]
    detectors: [ActionMenuDetector]
    readers:
      BattleHUDReader:
        fields:
          opponent_species:
            type: array
            items: string
            length: 2
            description: "Slot 0 (left/center), slot 1 (right). Singles uses slot 1 only; leave slot 0 blank."
          opponent_hp_pct:
            type: array
            items: int
            length: 2
            description: "Slot 0 (left/center), slot 1 (right). Singles uses slot 1 only; leave slot 0 blank."
          own_species:
            type: array
            items: string
            length: 2
            description: "Slot 0 (left/center), slot 1 (right). Singles uses slot 1 only; leave slot 0 blank."
          own_hp_current:
            type: array
            items: int
            length: 2
            description: "Current HP per slot. Slot 0 (left/center), slot 1 (right). Singles uses slot 1 only."
          own_hp_max:
            type: array
            items: int
            length: 2
            description: "Max HP per slot. Slot 0 (left/center), slot 1 (right). Singles uses slot 1 only."

  move_select:
    description: "4-move panel active. PP visible. Mega evo toggle possible. Singles or doubles."
    transitions_to: [target_select, action_menu]
    detectors: [MoveSelectDetector]
    # State-probe detectors fire conditionally based on per-frame state.
    # Listed here so the runner walks this screen's frames; expected value
    # is read per-frame from the manifest (default false if not present).
    state_probe_detectors: [MegaEvolveDetector]
    readers:
      MoveNameReader:
        fields:
          moves:
            type: array
            items: string
            length: 4
      MoveSelectCursorSlot:
        fields:
          slot:
            type: int
            min: 0
            max: 3
      ActiveHUDSlot:
        fields:
          slot:
            type: int
            min: -1
            max: 1
            description: "Doubles only: which own HUD pill is highlighted (0=left, 1=right). -1 = singles or no active outline."
      OwnStatusReader:
        fields:
          status:
            type: array
            items: string
            length: 2
            description: "Status condition per own slot: burn/poison/paralysis/sleep/freeze/none. Empty string skips that slot. Slot 1 box is provisional — leave slot 1 empty until corpus has a slot-1 status sample."
      BattleHUDReader:
        fields:
          opponent_species:
            type: array
            items: string
            length: 2
            description: "Slot 0 (left/center), slot 1 (right). Singles uses slot 1 only; leave slot 0 blank."
          opponent_hp_pct:
            type: array
            items: int
            length: 2
            description: "Slot 0 (left/center), slot 1 (right). Singles uses slot 1 only; leave slot 0 blank."
          own_species:
            type: array
            items: string
            length: 2
            description: "Slot 0 (left/center), slot 1 (right). Singles uses slot 1 only; leave slot 0 blank."
          own_hp_current:
            type: array
            items: int
            length: 2
            description: "Current HP per slot. Slot 0 (left/center), slot 1 (right). Singles uses slot 1 only."
          own_hp_max:
            type: array
            items: int
            length: 2
            description: "Max HP per slot. Slot 0 (left/center), slot 1 (right). Singles uses slot 1 only."
          move_pp_current:
            type: array
            items: int
            length: 4
            description: "Current PP per move slot 0..3 (top→bottom). Move-select screen only; -1 elsewhere. Max is intentionally NOT tracked — it's static (derivable from move data)."

  target_select:
    description: "Target selection modal after picking a move in doubles. Each potential target (2 opp + 2 own) has a colored selector strip (yellow/green = targeted, red/blue = not) and an effectiveness label. Each own active mon has its move name shown."
    transitions_to: [action_menu]
    detectors: [TargetSelectDetector]
    readers:
      TargetSelectReader:
        fields:
          own_moves:
            type: array
            items: string
            length: 2
            description: "Move slug per own active slot (slot 0/1)."
          opp_targeted:
            type: array
            items: bool
            length: 2
          own_targeted:
            type: array
            items: bool
            length: 2
          opp_effectiveness:
            type: array
            items: string
            length: 2
            description: "One of: super-effective, not-very-effective, no-effect, neutral. Empty if unread."
          own_effectiveness:
            type: array
            items: string
            length: 2

  singles_switch:
    description: "Choosing which mon to switch to (voluntary or forced) — singles 3-row layout."
    transitions_to: [action_menu]
    detectors: [PokemonSwitchDetector]
    readers: {}

  doubles_switch:
    description: "Choosing which mon to switch to (voluntary or forced) — doubles 4-row layout."
    transitions_to: [action_menu]
    detectors: [PokemonSwitchDetector]
    readers: {}

  # ── Shared battle states ───────────────────────────────────

  result_screen:
    description: "Battle ended. WON! or LOST displayed."
    transitions_to: [post_match]
    detectors: [ResultScreenDetector]
    readers:
      ResultReader:
        fields:
          won:
            type: bool

  post_match:
    description: "Quit Battling / Edit Team / Continue Battling buttons."
    transitions_to: [pre_match]
    # PostMatchScreenDetector specifically detects the 3-button menu being
    # fully drawn. The folder also includes pre-button transition frames
    # and frames with system overlays obscuring buttons — per-frame
    # manifest expectations control which.
    detectors: []
    state_probe_detectors: [PostMatchScreenDetector]
    readers: {}

  # ── Non-battle (menu) ──────────────────────────────────────

  main_menu:
    description: "Game home screen with Battle / Box / Train / Recruit / Shop tiles."
    transitions_to: [battle_mode_menu]
    detectors: [MainMenuDetector]
    readers: {}

  battle_mode_menu:
    description: "Battle mode list: Ranked Battles / Casual Battles / Private Battles / Online Competitions / Battle Data."
    transitions_to: [ranked_format_select, main_menu]
    detectors: [BattleModeMenuDetector]
    readers: {}

  ranked_format_select:
    description: "Choose between Single Battle and Double Battle for ranked."
    transitions_to: [pre_match, battle_mode_menu]
    detectors: [RankedFormatSelectDetector]
    readers: {}

  casual_format_select:
    description: "Casual battles format selector — Single Battle / Double Battle horizontal pills. Visually distinct from ranked_format_select (yellow + purple pills, not cyan/pink tiles)."
    transitions_to: [casual_pre_match, battle_mode_menu]
    detectors: [CasualFormatSelectDetector]
    readers: {}

  casual_pre_match:
    description: "Casual pre-match staging screen — Single Battle pill, Team N card, Change Music, Begin Matchmaking. Distinct from ranked pre_match (different theming, NPC dialog area, cursor highlights)."
    transitions_to: [team_select, searching_for_battle, casual_format_select]
    detectors: [CasualPreMatchDetector]
    readers: {}

  pre_match:
    description: "Pre-match staging screen: selected team displayed with Begin Matchmaking and Change Team buttons."
    transitions_to: [team_select, searching_for_battle, ranked_format_select]
    detectors: [PreMatchDetector]
    readers: {}

  moves_and_more:
    description: "Moves & More 2x3 grid showing team summary (active tab: Moves & More — yellow-highlighted). Each card shows species + ability + item + 4 moves."
    transitions_to: [team_select, team_stats]
    detectors: [MovesMoreDetector]
    readers:
      TeamSummaryReader:
        fields:
          species:
            type: array
            items: string
            length: 6
          ability:
            type: array
            items: string
            length: 6
          item:
            type: array
            items: string
            length: 6
          moves:
            type: array
            items: array
            length: 6
            inner_length: 4
            description: "Per-slot 4-move array (slot_i.moves = [m0, m1, m2, m3]). Empty string for unread slots."

  team_stats:
    description: "Stats tab on the View Details screen (active tab: Stats — yellow-highlighted). 2x3 grid showing 6 stats per mon (final value + EVs + nature arrow)."
    transitions_to: [team_select, moves_and_more]
    #  No detector yet. TeamStatsTabDetector to be added once boxes are
    #  drawn for the active-tab co-evidence + a card-bg purple gate (same
    #  shape as MovesMoreDetector). TeamStatsReader will read 6 stats per
    #  card: final value + EV (small number) + nature direction (arrow).
    detectors: []
    readers: {}

  battle_info:
    description: "Mid-battle Battle Info tab. L/R bar at top cycles through 4 active mons (own bottom, opp top). Per-mon left panel: species name, HP, types, ability+item (own only). Stat panel below: 7 rows × 7 dots showing boost stages + multiplier. Right panel: Active Statuses & Effects list with turn counters. Top-right: Total Time + Move Time."
    transitions_to: [action_menu, move_select]
    detectors: [BattleInfoDetector]
    readers:
      BattleInfoReader:
        fields:
          selected_slot:
            type: string  # "own_0" | "own_1" | "opp_0" | "opp_1"
          species:
            type: string
          hp_text:
            type: string

# ── Overlays (not screens in the state machine) ─────────────

overlays:

  communicating:
    description: "Communicating... text visible, waiting for opponent's turn submission. Appears over in-battle screens (typically after move_select)."
    readers: {}

  battle_log:
    description: "Text bar overlay during battle. Can appear over any in-battle screen."
    readers:
      BattleLogReader:
        fields:
          event_type:
            type: string

  ability_item:
    description: "Ability activation or item notification popup during battle."
    readers:
      AbilityItemReader:
        fields:
          pokemon:
            type: string
          name:
            type: string
          kind:
            type: string
