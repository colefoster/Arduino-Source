<div class="view" id="view-pokeballs">
    <h1>Pokeball Alive Detector</h1>
    <div class="subtitle">Per-frame run of <code>PokeballAliveDetector</code> across action_menu, move_select, battle_log. Each row shows the frame and 12 state indicators (own 0..5, opp 0..5). Green = alive, grey = fainted, dot = empty.</div>

    <div style="display:flex; gap:8px; align-items:center; margin:12px 0; flex-wrap:wrap;">
        <button id="pb-prev" class="btn">&larr; Prev</button>
        <button id="pb-next" class="btn">Next &rarr;</button>
        <button id="pb-rerun" class="btn">Re-run</button>
        <span id="pb-summary" style="color:#8b949e; font-size:12px;">Loading...</span>
    </div>

    <div id="pb-rows"></div>
</div>
